name: HLN Specification Conformance & Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-spec:
    name: Validate Schemas, OpenAPI & Conformance Vectors
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Validation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema pyyaml msgspec

      - name: Validate JSON Schemas (Draft 2020-12)
        run: |
          python - << 'EOF'
          import json, glob, sys
          from jsonschema import Draft202012Validator

          schemas = sorted(glob.glob("schemas/*.json"))
          if not schemas:
              print("Error: No schemas found!")
              sys.exit(1)

          for schema_path in schemas:
              with open(schema_path, "r", encoding="utf-8") as f:
                  data = json.load(f)
              Draft202012Validator.check_schema(data)
              print(f"Valid JSON Schema: {schema_path}")
          print(f"All {len(schemas)} schemas valid under Draft 2020-12.")
          EOF

      - name: Validate OpenAPI 3.1.0 Specification
        run: |
          python - << 'EOF'
          import yaml

          with open("api/openapi.yaml", "r", encoding="utf-8") as f:
              spec = yaml.safe_load(f)

          ver = spec.get("openapi", "")
          assert ver.startswith("3.1"), f"Invalid OpenAPI version: {ver}"
          paths = spec.get("paths", {})
          assert len(paths) >= 15, f"Too few paths in OpenAPI: {len(paths)}"
          assert "components" in spec and "schemas" in spec["components"], "Missing components.schemas"
          num_schemas = len(spec["components"]["schemas"])
          print(f"OpenAPI 3.1.0 specification valid: {len(paths)} paths, {num_schemas} schemas.")
          EOF

      - name: Validate Golden Test Vectors
        run: |
          python - << 'EOF'
          import json

          # 1. JCS Vectors
          with open("conformance/test-vectors/jcs.json", "r", encoding="utf-8") as f:
              jcs_suite = json.load(f)
          assert isinstance(jcs_suite, list) and len(jcs_suite) >= 4
          print(f"Loaded {len(jcs_suite)} JCS test cases.")

          # 2. Task Signing Vectors
          with open("conformance/test-vectors/task_signing.json", "r", encoding="utf-8") as f:
              ts_suite = json.load(f)
          assert "envelope" in ts_suite and "expected_hmac_sha256" in ts_suite
          assert len(ts_suite["expected_hmac_sha256"]) == 64
          print("Task Signing test case validated.")

          # 3. D-DNA Vectors
          with open("conformance/test-vectors/d_dna.json", "r", encoding="utf-8") as f:
              dna_suite = json.load(f)
          assert "records" in dna_suite and len(dna_suite["records"]) >= 3
          for r in dna_suite["records"]:
              assert len(r["expected_mac"]) == 64
          num_dna = len(dna_suite["records"])
          print(f"Loaded {num_dna} D-DNA test cases.")
          EOF
